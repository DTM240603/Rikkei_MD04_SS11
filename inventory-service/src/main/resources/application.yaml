spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/inventory_db}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  cache:
    type: redis
    cache-names: medicines
    redis:
      time-to-live: 60m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service-stock-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.value.default.type]": ra.edu.hw.md04.ss10.event.OrderEvent
        "[spring.json.trusted.packages]": ra.edu.hw.md04.ss10.event
        "[spring.json.use.type.headers]": false
    listener:
      ack-mode: record
